<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farnsworth House — IFC4 Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Live 3D viewer for the Farnsworth House IFC4 LOD 350 reference model.">
<meta property="og:title" content="Farnsworth House — IFC4 Viewer">
<meta property="og:description" content="Mies van der Rohe, 1951. Type-bound, gridded, curtain-walled IFC4 BIM model.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 100%; height: 100%; background: #1c1f24; color: #e6e6e6;
               font-family: 'Hiragino Sans','Yu Gothic','Inter',sans-serif;
               overflow: hidden; -webkit-font-smoothing: antialiased }
  #viewer { position: fixed; inset: 0 }
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            display: flex; align-items: center; gap: 14px;
            padding: 10px 16px; background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px }
  .brand { font-weight: 700; letter-spacing: 0.05em; color: #5cf }
  .title { flex: 1; color: #ccc; font-size: 11px; letter-spacing: 0.04em }
  .topbar a { color: #bbb; text-decoration: none; font-size: 11px;
              border: 1px solid rgba(255,255,255,0.15);
              padding: 5px 10px; border-radius: 4px; transition: 0.15s }
  .topbar a:hover { color: #5cf; border-color: #5cf }
  #status { position: fixed; bottom: 14px; left: 14px; z-index: 18;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
            padding: 12px 16px; font-size: 11px; color: #ccc; line-height: 1.6;
            max-width: 320px }
  #status .nm { color: #5cf; font-size: 13px; font-weight: 600;
                margin-bottom: 4px; letter-spacing: 0.02em }
  #status .progress { color: #999 }
  #status code { font-family: 'JetBrains Mono','SF Mono',monospace;
                 background: #2a2f37; padding: 2px 5px; border-radius: 3px }
  #legend { position: fixed; top: 60px; right: 14px; z-index: 18;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; padding: 10px 14px; font-size: 10px;
            color: #ccc; min-width: 170px; line-height: 1.7 }
  #legend .h { color: #5cf; font-size: 9px; letter-spacing: 0.22em;
               text-transform: uppercase; margin-bottom: 6px; font-weight: 700 }
  #legend label { display: flex; align-items: center; gap: 8px; cursor: pointer;
                  user-select: none }
  #legend input { accent-color: #5cf }
  #legend .sw { width: 11px; height: 11px; border-radius: 2px;
                border: 1px solid rgba(255,255,255,0.1); display: inline-block }
  .footer { position: fixed; bottom: 0; left: 0; right: 0;
            text-align: center; padding: 6px;
            font-size: 10px; color: #666; pointer-events: none }
  .footer a { color: #5cf; pointer-events: auto; text-decoration: none }
</style>
<script type="importmap">
{
  "imports": {
    "three":      "https://unpkg.com/three@0.160.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/",
    "web-ifc":    "https://unpkg.com/web-ifc@0.0.66/web-ifc-api.js"
  }
}
</script>
</head>
<body>
<div class="topbar">
  <span class="brand">FARNSWORTH IFC4</span>
  <span class="title">Mies van der Rohe, 1951 — LOD 350 reference model</span>
  <a href="./farnsworth_house_v2.ifc" download>↓ IFC4 (122 KB)</a>
  <a href="https://github.com/yukihamada/farnsworth-ifc" target="_blank">GitHub ↗</a>
</div>

<div id="viewer"></div>

<div id="status">
  <div class="nm">Loading model …</div>
  <div class="progress">Initializing web-ifc WASM …</div>
</div>

<div id="legend">
  <div class="h">Layers</div>
  <label><input type="checkbox" id="lyr-IfcSlab" checked><span class="sw" style="background:#dcd2bf"></span> Slab / Roof</label>
  <label><input type="checkbox" id="lyr-IfcColumn" checked><span class="sw" style="background:#fafaf7"></span> Column (W8x48)</label>
  <label><input type="checkbox" id="lyr-IfcCurtainWall" checked><span class="sw" style="background:#a8c9d8"></span> Curtain Wall</label>
  <label><input type="checkbox" id="lyr-IfcMember" checked><span class="sw" style="background:#b8bcc0"></span> Mullion</label>
  <label><input type="checkbox" id="lyr-IfcPlate" checked><span class="sw" style="background:#a8c9d8"></span> Glass Panel</label>
  <label><input type="checkbox" id="lyr-IfcDoor" checked><span class="sw" style="background:#888a8c"></span> Door</label>
  <label><input type="checkbox" id="lyr-IfcStair" checked><span class="sw" style="background:#cbb98c"></span> Stair</label>
  <label><input type="checkbox" id="lyr-IfcRailing" checked><span class="sw" style="background:#8a8a85"></span> Railing</label>
  <label><input type="checkbox" id="lyr-IfcFurnishingElement" checked><span class="sw" style="background:#d9a866"></span> Furniture / Core</label>
  <label><input type="checkbox" id="lyr-IfcSanitaryTerminal" checked><span class="sw" style="background:#f7f7f5"></span> Sanitary</label>
  <label><input type="checkbox" id="lyr-IfcCovering" checked><span class="sw" style="background:#dac8a6"></span> Finish / Curtain</label>
  <label><input type="checkbox" id="lyr-IfcLightFixture" checked><span class="sw" style="background:#c8a050"></span> Lighting</label>
  <label><input type="checkbox" id="lyr-IfcGeographicElement"><span class="sw" style="background:#4f7333"></span> Site / Trees</label>
  <label><input type="checkbox" id="lyr-IfcSpace"><span class="sw" style="background:#2a4a8c"></span> Space (hidden)</label>
  <label><input type="checkbox" id="lyr-Ground"><span class="sw" style="background:#4d6633"></span> Ground</label>
</div>

<div class="footer">
  Self-hosted IFC viewer using <a href="https://ifcjs.github.io/info/" target="_blank">web-ifc</a> (WASM) + three.js — full IFC4 support including IfcCurtainWall, IfcMember, IfcGrid, IfcSpaceBoundary.
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as WebIFC from 'web-ifc';

const status = document.getElementById('status');
function setStatus(name, progress) {
  status.querySelector('.nm').textContent = name;
  status.querySelector('.progress').innerHTML = progress;
}

// ----- Three.js scene -----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('viewer').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1c1f24');
scene.fog = new THREE.Fog('#1c1f24', 60, 200);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(28, 16, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lighting
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(40, 50, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;   sun.shadow.camera.bottom = -50;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.HemisphereLight(0xbcdcff, 0x556633, 0.4));

// Ground / sky
const grid = new THREE.GridHelper(120, 60, 0x444444, 0x2a2e35);
grid.position.y = -0.01;
scene.add(grid);

// ----- Load IFC -----
const ifcAPI = new WebIFC.IfcAPI();
ifcAPI.SetWasmPath('https://unpkg.com/web-ifc@0.0.66/');
setStatus('Loading model …', 'Initializing WASM …');
await ifcAPI.Init();

setStatus('Loading model …', 'Fetching <code>farnsworth_house_v2.ifc</code>');
const ifcUrl = new URL('./farnsworth_house_v2.ifc', location.href);
const buf = await fetch(ifcUrl).then(r => r.arrayBuffer());
const bytes = new Uint8Array(buf);
console.log(`IFC file: ${bytes.length} bytes`);

setStatus('Loading model …', 'Parsing IFC …');
const modelID = ifcAPI.OpenModel(bytes);
console.log('modelID:', modelID);

setStatus('Loading model …', 'Extracting geometry …');

// ----- Build typed groups -----
const TYPE_COLOURS = {
  IfcSlab:        { color: 0xdcd2bf, opacity: 1.0 },
  IfcRoof:        { color: 0xa89880, opacity: 1.0 },
  IfcColumn:      { color: 0xf0f0ec, opacity: 1.0 },
  IfcCurtainWall: { color: 0xa8c9d8, opacity: 0.4 },
  IfcMember:      { color: 0xc8c8c4, opacity: 1.0 },
  IfcPlate:       { color: 0x9bb8c8, opacity: 0.30 },
  IfcDoor:        { color: 0x6a6c6e, opacity: 0.85 },
  IfcStair:       { color: 0xcbb98c, opacity: 1.0 },
  IfcStairFlight: { color: 0xcbb98c, opacity: 1.0 },
  IfcRailing:     { color: 0x8a8a85, opacity: 1.0 },
  IfcSpace:       { color: 0x2a4a8c, opacity: 0.10, visible: false },
  IfcOpeningElement: { color: 0xff0000, opacity: 0.0, visible: false },
  Ground:         { color: 0x4d6633, opacity: 1.0, visible: false },
  // LOD 400 interior + site
  IfcFurnishingElement: { color: 0xd9a866, opacity: 1.0 },  // primavera-ish default
  IfcSanitaryTerminal:  { color: 0xf7f7f5, opacity: 1.0 },
  IfcGeographicElement: { color: 0x4f7333, opacity: 0.85, visible: false },
  IfcCovering:          { color: 0xdac8a6, opacity: 1.0 },
  IfcLightFixture:      { color: 0xc8a050, opacity: 1.0 },
};

// Per-name overrides — these are per-instance look tweaks for the
// iconic Mies pieces, applied after default class colour.
const NAME_COLOURS = [
  { test: /Primavera Wood Core/i,         color: 0xd9a866 },
  { test: /Wardrobe|Nightstand|Sideboard|Bookshelf/i, color: 0xc89856 },
  { test: /Fireplace.*Hearth|Chimney/i,   color: 0x9a8b78 },
  { test: /Kitchen Counter|Range Hood|Cooktop|Refrigerator/i,
                                          color: 0xc5c8cc },
  { test: /Brno|Barcelona/i,              color: 0x141414 },  // black leather
  { test: /Dining Table/i,                color: 0xeae6dd },  // marble
  { test: /Coffee Table/i,                color: 0x9bb8c8, opacity: 0.5 },
  { test: /Bed \(/i,                      color: 0xe6dac1 },  // linen
  { test: /Tree Trunk|Black Maple \(/i,   color: 0x55402c, opacity: 1.0 },
  { test: /Tree Canopy|Maple Canopy/i,    color: 0x4f7333, opacity: 0.78 },
  { test: /WC|Wall-hung Sink/i,           color: 0xfafaf7 },
  { test: /Kitchen Sink/i,                color: 0xb8bcc0 },
  { test: /Shower/i,                      color: 0xa8c9d8, opacity: 0.45 },
  // LOD-400/500 finishes & lighting
  { test: /Travertine Floor Finish/i,     color: 0xddc99a },
  { test: /Plaster Ceiling/i,             color: 0xf2f0e8 },
  { test: /Shantung Curtain/i,            color: 0xeee0c2, opacity: 0.45 },
  { test: /Curtain Track/i,               color: 0xb89030 },
  { test: /Floor Lamp|Table Lamp/i,       color: 0xc89030 },
  { test: /Ceiling Recessed Downlight/i,  color: 0xfffbe8 },
  { test: /Window Stop/i,                 color: 0x9da0a4 },
  { test: /Fox River/i,                   color: 0x4070a0, opacity: 0.55 },
  { test: /Gravel Driveway/i,             color: 0xc8c2b0 },
  { test: /Bluestone Path/i,              color: 0x6c7078 },
];
const groups = {};
function groupFor(typeName) {
  if (!groups[typeName]) {
    groups[typeName] = new THREE.Group();
    groups[typeName].name = typeName;
    scene.add(groups[typeName]);
  }
  return groups[typeName];
}

// Get geometry for every product
const allLines = ifcAPI.GetAllLines(modelID);
console.log(`Total lines: ${allLines.size()}`);

const productExpressIDs = new Set();
for (const cls of [
  WebIFC.IFCSLAB, WebIFC.IFCROOF, WebIFC.IFCCOLUMN,
  WebIFC.IFCCURTAINWALL, WebIFC.IFCMEMBER, WebIFC.IFCPLATE,
  WebIFC.IFCDOOR, WebIFC.IFCSTAIR, WebIFC.IFCSTAIRFLIGHT,
  WebIFC.IFCRAILING, WebIFC.IFCSPACE,
  WebIFC.IFCWALL, WebIFC.IFCWINDOW, WebIFC.IFCBEAM,
]) {
  if (!cls) continue;
  const ids = ifcAPI.GetLineIDsWithType(modelID, cls);
  for (let i = 0; i < ids.size(); i++) productExpressIDs.add(ids.get(i));
}
console.log(`Product express IDs to render: ${productExpressIDs.size}`);

// ifcAPI.StreamAllMeshes streams meshes for each product
let count = 0;
let totalVerts = 0;
ifcAPI.StreamAllMeshes(modelID, (flatMesh) => {
  const expressID = flatMesh.expressID;
  const placedGeoms = flatMesh.geometries;

  // Resolve type
  const line = ifcAPI.GetLine(modelID, expressID, false);
  const typeCode = line.type;
  let typeName = ifcAPI.GetNameFromTypeCode(typeCode) || 'IfcProduct';
  const ifcName = line.Name?.value || '';
  // Send the site terrain into its own "Ground" group so it can be toggled
  // and is excluded from the camera-fit bbox.
  if (typeName === 'IfcSlab' && /ground|meadow/i.test(ifcName)) {
    typeName = 'Ground';
  }

  for (let j = 0; j < placedGeoms.size(); j++) {
    const placed = placedGeoms.get(j);
    const ifcGeom = ifcAPI.GetGeometry(modelID, placed.geometryExpressID);

    const verts = ifcAPI.GetVertexArray(ifcGeom.GetVertexData(), ifcGeom.GetVertexDataSize());
    const indices = ifcAPI.GetIndexArray(ifcGeom.GetIndexData(), ifcGeom.GetIndexDataSize());

    // verts: interleaved [x,y,z, nx,ny,nz] per vertex
    const nVerts = verts.length / 6;
    const positions = new Float32Array(nVerts * 3);
    const normals   = new Float32Array(nVerts * 3);
    for (let k = 0; k < nVerts; k++) {
      positions[k*3]   = verts[k*6];
      positions[k*3+1] = verts[k*6+1];
      positions[k*3+2] = verts[k*6+2];
      normals[k*3]     = verts[k*6+3];
      normals[k*3+1]   = verts[k*6+4];
      normals[k*3+2]   = verts[k*6+5];
    }
    totalVerts += nVerts;

    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    bg.setAttribute('normal',   new THREE.BufferAttribute(normals, 3));
    bg.setIndex(new THREE.BufferAttribute(new Uint32Array(indices), 1));

    let colourSpec = TYPE_COLOURS[typeName] ||
                     { color: 0xb0b8c0, opacity: 1.0 };
    // Name-based overrides for iconic Mies pieces
    for (const rule of NAME_COLOURS) {
      if (rule.test.test(ifcName)) {
        colourSpec = {
          color: rule.color,
          opacity: rule.opacity ?? colourSpec.opacity,
        };
        break;
      }
    }
    const mat = new THREE.MeshStandardMaterial({
      color: colourSpec.color,
      transparent: colourSpec.opacity < 1,
      opacity: colourSpec.opacity,
      side: THREE.DoubleSide,
      metalness: typeName === 'IfcMember' ? 0.7 : 0.05,
      roughness: typeName === 'IfcPlate' ? 0.05 : 0.6,
    });
    const mesh = new THREE.Mesh(bg, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    // Edge overlay so thin elements (mullions, columns, glass) read clearly
    if (typeName !== 'Ground' && typeName !== 'IfcSpace') {
      const edges = new THREE.EdgesGeometry(bg, 25);
      const edgeLines = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({
          color: 0x0a0e14,
          transparent: true,
          opacity: 0.55,
        })
      );
      mesh.add(edgeLines);
    }

    // IFC matrix is column-major in flat array; three uses column-major too
    const m4 = new THREE.Matrix4();
    m4.fromArray(placed.flatTransformation);
    mesh.applyMatrix4(m4);

    // Convert from IFC's Z-up to three's Y-up
    // (we'll do this once on the parent group instead)

    mesh.userData = { ifcType: typeName, expressID };
    if (colourSpec.visible === false) mesh.visible = false;

    groupFor(typeName).add(mesh);
    count++;
    ifcGeom.delete?.();
  }
});

ifcAPI.CloseModel(modelID);

// web-ifc's flatTransformation already maps IFC Z (vertical) to three's Y,
// so we render directly without an extra rotation.
const root = new THREE.Group();
for (const k of Object.keys(groups)) root.add(groups[k]);
scene.add(root);
window.__root = root;
window.__groups = groups;

console.log(`Rendered ${count} meshes, ${totalVerts} vertices total`);

// ----- Frame the model (excluding the huge ground / site / spaces) -----
const bbox = new THREE.Box3();
const SKIP_FOR_BBOX = new Set([
  'Ground', 'IfcSpace', 'IfcOpeningElement', 'IfcGeographicElement',
]);
for (const k of Object.keys(groups)) {
  if (SKIP_FOR_BBOX.has(k)) continue;
  bbox.expandByObject(groups[k]);
}
if (bbox.isEmpty()) bbox.setFromObject(root);
const size = bbox.getSize(new THREE.Vector3());
const center = bbox.getCenter(new THREE.Vector3());
controls.target.copy(center);

// Distance that fits the building's longest extent into the viewport,
// with a 35% margin so it doesn't touch the edges.
const fovRad = camera.fov * Math.PI / 180;
const maxDim = Math.max(size.x, size.y, size.z);
const fitDist = (maxDim / 2) / Math.tan(fovRad / 2) * 1.35;

// Architectural 3/4 view from south-east, eye-level slightly above slab.
// Camera is far enough to fit the 23-m long pavilion, but close enough
// that the 4.75-m height reads as a building, not a strip.
const dirX =  0.7;
const dirY =  0.45;
const dirZ =  1.0;
const dirLen = Math.hypot(dirX, dirY, dirZ);
const camDist = Math.max(fitDist * 0.8, size.x * 1.0);
camera.position.set(
  center.x + camDist * dirX / dirLen,
  center.y + camDist * dirY / dirLen,
  center.z + camDist * dirZ / dirLen,
);
camera.far = Math.max(camera.far, camDist * 10);
camera.near = 0.1;
camera.updateProjectionMatrix();
controls.update();

setStatus(
  'Farnsworth House',
  `Mies van der Rohe, 1951<br>` +
  `${count} meshes · ${totalVerts.toLocaleString()} vertices<br>` +
  `<code>${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} m</code>`
);

// ----- Layer toggles -----
const layerNames = Object.keys(TYPE_COLOURS);
for (const t of layerNames) {
  const cb = document.getElementById('lyr-' + t);
  if (!cb) continue;
  cb.addEventListener('change', () => {
    if (groups[t]) groups[t].visible = cb.checked;
  });
  if (TYPE_COLOURS[t].visible === false) {
    cb.checked = false;
    if (groups[t]) groups[t].visible = false;
  }
}

// ----- Render loop -----
function render() {
  requestAnimationFrame(render);
  controls.update();
  renderer.render(scene, camera);
}
render();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
